<!DOCTYPE html>
<html>
<head>
  <title>WeBlog | Create Blogs </title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="standalone-page post-editor">
  <h1> Create a Blog Post</h1>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}
    {% if is_owner %}
        <form method="post" action="/publish_post">
            <input type="hidden" name="uuid" value="{{ user.uuid }}">
            <p>
                <label for="title">Title:</label><br>
                <input type="text" id="title" name="title" value="title" maxlength="128" required>
            </p>         
            <p>
                <label for="contents">Contents:</label><br>
                <textarea id="contents" name="contents" rows="10" cols="50" value="contents" maxlength="4096" required></textarea>
            </p>
            <p class="checkbox-row">
                <input type="checkbox" id="published" name="published" value="1">
                <label for="published">
                    Publish this post
                </label>
            </p>
            <p class="intro">Leave unchecked to save as a draft.</p>
            <p class="actions">
                <button type="submit" name="action" value="save">Save</button>
                <button type="submit" name="action" value="save_exit">Save and Exit</button>
                <a href="{{ url_for('view_profile', user_id=user['uuid']) }}">Cancel</a>
            </p>
        </form>
    {% else %}
        <p>You can only create posts on your own profile.</p>
        <p>
            <a href="/profiles/{{ user.uuid }}">Back to Profile</a>
        </p>
    {% endif %}
</body>
</html>
