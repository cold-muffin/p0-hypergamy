<!DOCTYPE html>
<html>

<head>
    <title> WeBlog | Log In </title>
</head>

<body>
  <h1>
    Log In
  </h1>
  <h3>
        Welcome back! Please enter your username and password.
  </h3>
  {% if error %}
    <p>{{ error }}</p>
  {% endif %}

    <form action="/login" method="post">
      <p>
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" value="{{ username|default('', true) }}"placeholder="Username" required>
      </p>

      <p>
       <label for="password">Password:</label>
       <input type="password" id="password" name="password" placeholder="Password" required>
      </p>
        <button type="submit">Log in</button>
    </form>
    <p>
        Don't have an account? <a href="/new_user">Sign up</a>
    </p>

    <br>
</body>

</html>
