<!DOCTYPE html>
<html>
<head>
  <title>WeBlog | Home </title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% include "navbar.html" %}
  <br>
  {% if username %}
    <h1>Welcome, {{ username }}! </h1>
    <p> 
      Create a new blog post to share!
    </p>
  {% else %}
    <h1>Welcome to WeBlog!</h1>
    <p> 
      You are not logged in.
    </p>
    <p class="actions home-links">
    <a class="button" href="/login">Log in</a>
    <br>
    <a class="button" href="/new_user">Sign up</a>
</p>
  {% endif %}
</body>
</html>
